#===============================================================================
# HAProxy config for a 3-node Neo4j cluster
#   :7473  HTTPS  -> Browser + HTTP Query API (TLS terminated here)
#   :7474  HTTP   -> same, plaintext (in-VPC / testing only)
#   :7687  Bolt   -> TCP passthrough (TLS end-to-end to the nodes)
#   :8404         -> HAProxy stats + Prometheus metrics
#
# Reviewed/rewritten from the original. Every change is marked [FIX] or [ADD]
# with the reason. Requires HAProxy 2.4+ (named defaults sections).
#===============================================================================

global
  # NOTE: no 'master-worker' here. It's deprecated in 3.3 (removed in 3.5), and
  # the official Docker image's entrypoint already starts haproxy with -W.
  # Declaring it in the config just produced "master-worker mode is already
  # configured". If you run haproxy yourself outside Docker, pass -W (or -Ws for
  # systemd notify) in the startup command instead.
  log stdout format raw local0 info

  # [ADD] Without an explicit maxconn HAProxy derives it from RLIMIT_NOFILE,
  # which on a stock systemd unit can be low enough to cap your test long
  # before Neo4j breaks a sweat. Set it explicitly and raise LimitNOFILE.
  maxconn 60000

  # [ADD] Threads. HAProxy autodetects on 2.4+, but pin it so your perf
  # numbers are reproducible across instance types. Set to vCPU count.
  # nbthread 4

  # [ADD] Runtime API. Non-negotiable for perf testing: this is how you see
  # queue depth, per-server session counts, and connection reuse rates.
  #
  # Bound to loopback TCP rather than a UNIX socket, on purpose. Creating a
  # socket file needs write permission on its directory, and this container runs
  # as --user "$(id -u):$(id -g)": /var/run in the image is root-owned, and the
  # mounted config dir is often root-owned too (anything copied in with sudo),
  # which yields exactly:
  #   cannot bind UNIX socket (Permission denied)
  # A TCP listener has no filesystem permissions to get wrong.
  #
  # Safe because --network host means 127.0.0.1 really is the host's loopback,
  # so this is not reachable off-box regardless of the security group. Do NOT
  # change it to 0.0.0.0 — 'level admin' allows disabling servers at runtime.
  #
  # From the host:
  #   echo "show stat"  | socat tcp4-connect:127.0.0.1:9999 stdio
  #   echo "show info"  | socat tcp4-connect:127.0.0.1:9999 stdio
  #
  # 'expose-fd listeners' is deliberately gone: it only applies to UNIX sockets
  # (fd passing), and with master-worker reloads via USR2 the master handles
  # socket handover itself, so it was never doing anything here.
  stats socket ipv4@127.0.0.1:9999 level admin
  stats timeout 30s

  # UNIX socket alternative, if you'd rather not open a port. Requires the
  # directory to be writable by your uid:
  #   mkdir -p $HOME/haproxy01/run
  #   sudo chown -R "$(id -u):$(id -g)" $HOME/haproxy01
  # stats socket /usr/local/etc/haproxy/run/haproxy.sock mode 660 level admin

  # [ADD] TLS defaults. Modern-only; raise to TLSv1.3 if all clients support it.
  #
  # There is no 'ssl-default-bind-min-ver' keyword — the minimum version is a
  # *bind option*, set globally via ssl-default-bind-options. That was the fatal
  # error; everything else in the log was a warning.
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!SHA1
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  tune.ssl.default-dh-param 2048


#===============================================================================
# DEFAULTS
# [FIX] The original had ONE defaults section shared by HTTP and Bolt. That is
# the single biggest bug in the config: HTTP wants short timeouts, Bolt needs
# very long ones. Split them.
#===============================================================================

defaults http_defaults
  log global
  option dontlognull
  retries 3

  # [FIX] 'option redispatch' was applied to everything, including writes.
  # Combined with retries 3, a write that times out can be replayed on another
  # node -> duplicate writes, and a perf test that silently double-counts.
  # Retry only on connection-level failures, never on a request already sent.
  retry-on conn-failure empty-response

  timeout http-request     15s
  # Must stay ABOVE the Go client's Transport.IdleConnTimeout (20s in the
  # benchmark tool). If the client holds pooled connections longer than HAProxy
  # does, HAProxy closes them first and the client hands out a dead socket —
  # a sporadic EOF that Go will not retry for a POST with a body.
  timeout http-keep-alive  30s
  timeout queue            1m
  timeout connect          5s

  # [FIX] Was 30s. Any Cypher query slower than 30s returned 504 and showed up
  # in your results as an error rather than a slow query. Raise well above your
  # p99.9, then let Neo4j's own transaction timeout be the real limit.
  timeout client  300s
  timeout server  300s
  timeout tunnel  1h


defaults bolt_defaults
  log global
  option dontlognull
  retries 3
  retry-on conn-failure

  # [ADD] Keepalives so idle pooled Bolt connections aren't silently dropped
  # by HAProxy or by any stateful device in between.
  option tcpka
  option clitcpka
  option srvtcpka

  timeout connect 5s

  # [FIX] CRITICAL. The original inherited 'timeout client 30s' from the shared
  # defaults. In mode tcp that is an INACTIVITY timeout, so every idle
  # connection in a Neo4j driver's pool got killed after 30 seconds. Symptom is
  # intermittent SessionExpired / connection reset under low load, and inflated
  # tail latency under high load as the driver rebuilds the pool. Must be longer
  # than the driver's max connection lifetime (default 1h).
  timeout client  12h
  timeout server  12h
  timeout tunnel  12h


# Short-lived HTTP for the stats/metrics listener. It gets its own section so it
# can't inherit bolt_defaults' 12-hour timeouts — a scrape endpoint holding
# connections open for half a day is not what you want.
defaults monitor_defaults
  mode http
  timeout connect 5s
  timeout client  10s
  timeout server  10s


# [FIX] Catch-all, declared last so it is what any proxy WITHOUT an explicit
# 'from' inherits.
#
# This is what the two warnings were about: bolt_defaults was both explicitly
# referenced (frontend lb_bolt) and, being the last defaults section, implicitly
# inherited by proxies that omitted 'from'. HAProxy refuses to guess which you
# meant. Every proxy below now names its defaults explicitly, so nothing uses
# this one — but if a future section forgets 'from', it lands here with sane
# HTTP timeouts rather than silently picking up Bolt's 12h.
defaults implicit_defaults
  log global
  option dontlognull
  timeout connect 5s
  timeout client  60s
  timeout server  60s


#===============================================================================
# FRONTENDS
#===============================================================================

frontend neo4j_http from http_defaults
  mode http
  option httplog

  # [ADD] TLS terminates here. HAProxy wants ONE pem file: fullchain THEN key.
  #
  # Path is inside the existing mounted volume, so no second -v is needed:
  #   mkdir -p $HOME/haproxy01/certs
  #   cat fullchain.pem privkey.pem > $HOME/haproxy01/certs/neo4j.pem
  #   chmod 600 $HOME/haproxy01/certs/neo4j.pem
  # (600 is fine — the container runs as your uid, so you are the reader.)
  #
  # Until the cert exists this bind is fatal. Comment it out and use :7474 only.
  #bind :7473 ssl crt /usr/local/etc/haproxy/certs/neo4j.pem alpn h2,http/1.1

  # Plaintext listener. Keep for in-VPC load generation (removes TLS handshake
  # cost from your measurements); remove or firewall it in production.
  bind :7474

  maxconn 20000

  # [ADD] Per-request logging to stdout is itself a throughput limiter at high
  # RPS. This keeps errors and 4xx/5xx but drops the successful-request firehose.
  # Comment it out when you're debugging rather than benchmarking.
  option dontlog-normal

  # [ADD] Timing detail you actually want in the logs that remain: Tq/Tw/Tc/Tr/Ta
  # tells you whether latency is queueing in HAProxy or waiting on Neo4j.
  log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %{+Q}r"

  # [FIX] '{ path /db }' was dead weight; path_beg covers it.
  # Note this sends /db/<name>/cluster/* health and discovery paths to the
  # query backend too, which is fine.
  acl is_query_api path_beg /db/
  use_backend query_http_servers if is_query_api
  default_backend neo4j_http_servers


frontend lb_bolt from bolt_defaults
  mode tcp
  option tcplog
  bind :7687
  maxconn 20000
  default_backend neo4j_bolt_servers


# [ADD] Stats + Prometheus. Scrape :8404/metrics during runs; without this you
# cannot tell whether a latency cliff is HAProxy queueing or Neo4j saturating.
frontend monitoring from monitor_defaults
  mode http
  bind :8404
  no log
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /stats
  stats refresh 5s


#===============================================================================
# BACKENDS
#===============================================================================

# ---- HTTP Query API -----------------------------------------------------------
backend query_http_servers from http_defaults
  mode http

  # [FIX] 'option httplog' in a backend does nothing (it's a frontend/defaults
  # keyword). Removed.

  # roundrobin is fine for uniform queries. If query cost varies, leastconn
  # tracks actual node load far better — worth measuring both.
  balance roundrobin
  # balance leastconn

  http-reuse always

  # [ADD] Query API v2 explicit-transaction affinity.
  #
  # Aura's own managed proxy stamps a neo4j-cluster-affinity response header
  # on a transaction's begin call and expects the client to replay it on
  # execute/commit/rollback, routing on it internally. That header is an
  # Aura-proxy feature, NOT part of the Query API v2 server contract — a
  # self-managed node never sets it itself. Without it (and Location isn't
  # dependable behind a LB either), execute/commit/rollback for an explicit
  # transaction get round-robined to a random node instead of the one that
  # owns the transaction, and fail (symptom: the transaction id from begin's
  # body is no longer known to whichever node answers next).
  #
  # This backend fills that gap itself, so a self-managed cluster gets the
  # same contract Aura gives you for free. queryAPIBenchmarks-go's
  # internal/managed already captures and replays this header unchanged —
  # this is the other half, on the LB.
  acl is_qv2_tx_begin    path -m reg ^/db/[^/]+/query/v2/tx$
  acl is_qv2_tx_continue path -m reg ^/db/[^/]+/query/v2/tx/

  # [FIX] 'path' is a request-phase fetch; the http-response rule further
  # below that needs to know "was this a begin call" cannot see it directly —
  # haproxy -c rejects that with "acl will never match because it only
  # involves keywords that are incompatible with backend http-response header
  # rule". Stash the fact in a transaction variable while it's still visible,
  # and read the variable back in the response.
  #
  # Placed before the use-server rules below to match evaluation order: all
  # http-request rules in a backend run before any use-server rule
  # regardless of textual position, so this would work either way, but
  # haproxy -c warns about it if left after — put here for the reader too.
  http-request set-var(txn.qv2_tx_begin) str(1) if is_qv2_tx_begin

  # Pin a continuation call to the server named in the affinity header the
  # client is replaying, bypassing 'balance roundrobin' for it. One line per
  # server below — add one here if you add a fourth node. Anything that
  # doesn't match (including the begin call itself) falls through to normal
  # round-robin, so load still spreads across all three nodes for begins.
  use-server query01 if is_qv2_tx_continue { req.hdr(neo4j-cluster-affinity) -m str query01 }
  use-server query02 if is_qv2_tx_continue { req.hdr(neo4j-cluster-affinity) -m str query02 }
  use-server query03 if is_qv2_tx_continue { req.hdr(neo4j-cluster-affinity) -m str query03 }

  # [FIX] /db/neo4j/cluster/available requires authentication in 2026.x, so the
  # earlier version of this check failed with 401 and marked every node down.
  #
  # Two options. Pick one; the POST variant below is better but needs credentials
  # in this file.
  #
  # OPTION A (in use) — unauthenticated discovery endpoint.
  # This is the `/` that your curl hit. No credentials needed, and it is a real
  # improvement on the original bare 'check': a TCP connect succeeds the moment
  # the listener binds, whereas a 200 here means the HTTP stack is fully
  # initialised and serving. What it does NOT tell you is whether the database
  # itself is available or this member has fallen behind.
  #option httpchk
  #http-check send meth GET uri / ver HTTP/1.1 hdr Host neo4j
  #http-check expect status 200

  # OPTION B (better, needs auth) — exercise the actual Query API.
  # For a Query API load balancer this is the truest health signal: it proves the
  # database can serve the endpoint you're balancing, not merely that the process
  # is listening. At 'inter 2s' across 3 nodes it costs ~1.5 trivial queries/sec.
  #
  # Create a dedicated least-privilege user first, so the real neo4j password
  # never goes in this file. RETURN 1 needs database access and nothing else:
  #
  #   CREATE USER hapchk SET PLAINTEXT PASSWORD 'changeme' CHANGE NOT REQUIRED;
  #   CREATE ROLE healthcheck;
  #   GRANT ACCESS ON DATABASE neo4j TO healthcheck;
  #   GRANT ROLE healthcheck TO hapchk;
  #
  # Then:  echo -n 'hapchk:changeme' | base64
  #
  # Note this must stay on ONE line — haproxy.cfg has no line continuations.
  # Single quotes keep the JSON body's double quotes literal.
  #
  option httpchk
  http-check send meth POST uri /db/neo4j/query/v2 ver HTTP/1.1 hdr Host neo4j hdr Content-Type application/json hdr Authorization "Basic aGFwY2hrOmNoYW5nZW1l" body '{"statement":"RETURN 1"}'
  http-check expect status 200-299
  #
  # The Query API returns 202 Accepted on success, not 200 — hence the range.
  # A 401 here means the base64 is wrong; a 404 means the database name is.

  # [ADD] Tight check interval so failover is fast and visible in your results.
  # maxconn per server creates a queue at HAProxy instead of dogpiling a node —
  # tune to roughly Neo4j's server.bolt.thread_pool_max_size.
  # 'observe layer7' was here but did nothing without a matching 'on-error', and
  # marking servers down on response errors causes flapping mid-load-test.
  # Dropped: the httpchk above is the health signal.
  default-server check inter 2s fall 3 rise 2 maxconn 2000

  server query01 ip-10-0-29-201.ec2.internal:7474
  server query02 ip-10-0-20-122.ec2.internal:7474
  server query03 ip-10-0-25-221.ec2.internal:7474

  # Tell the client which server just handled its begin call, so it can
  # replay the value on execute/commit/rollback — see the use-server rules
  # and the txn.qv2_tx_begin variable above, which read it back on the way in.
  #
  # Verified end-to-end against haproxy 3.4.3 with three mock backends: a
  # begin call correctly came back with neo4j-cluster-affinity naming
  # whichever server round-robin picked, and continuation calls tagged with
  # that value landed on that exact server every time (including .../commit),
  # never on either of the other two. If a future haproxy version behaves
  # differently and the header ever comes back empty, the fallback is
  # 'balance source' on this whole backend instead of this block — it loses
  # cross-node spread on begin calls, but every call from one client
  # consistently lands on one node, so explicit transactions can't break even
  # without any affinity header.
  http-response set-header neo4j-cluster-affinity %[srv_name] if { var(txn.qv2_tx_begin) -m found }

  # [NOTE] Legacy flavor (POST /db/<name>/tx — no '/query/v2/' in the path) is
  # untouched by any of the above: is_qv2_tx_begin/is_qv2_tx_continue only
  # match the Query API v2 tx path, so legacy keeps using the begin
  # response's Location header instead. That IS a Neo4j server feature (via
  # server.http.advertised_address, see docs/awsSetup/neo4/neo4j.conf), not
  # an Aura-only one, so it needs no equivalent LB-side help.


# ---- Browser / everything else -----------------------------------------------
backend neo4j_http_servers from http_defaults
  mode http

  # [FIX] 'stick on src' removed. Neo4j 5+ Browser is a static app that then
  # talks Bolt, so it gains nothing — and during a load test your generators
  # come from a handful of source IPs, so stick-on-src pinned effectively all
  # traffic to ONE node. You would have been benchmarking a single instance
  # while believing you were testing three.
  balance roundrobin

  # Discovery endpoint — unauthenticated, and it's what Browser fetches first
  # anyway, so it's the right check for this backend.
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host neo4j
  http-check expect status 200
  default-server check inter 5s fall 3 rise 2

  server http01 ip-10-0-29-201.ec2.internal:7474
  server http02 ip-10-0-20-122.ec2.internal:7474
  server http03 ip-10-0-25-221.ec2.internal:7474


# ---- Bolt (TLS passthrough) ---------------------------------------------------
backend neo4j_bolt_servers from bolt_defaults
  # [FIX] The original omitted 'from load_balancer_defaults' here, so this
  # backend inherited nothing — no logging, and HAProxy warned about missing
  # timeouts. Now explicitly on bolt_defaults.
  mode tcp

  # [FIX] 'stick on src' removed, same reason as above. With neo4j+s:// the
  # driver only uses the LB for discovery and then connects to nodes directly,
  # so stickiness buys nothing. But if any client uses plain bolt:// (no
  # routing), stick-on-src sends the entire test load to one node.
  balance leastconn

  # TCP connect only. Bolt has no unauthenticated health endpoint, so this just
  # proves the port is bound.
  #
  # You can do better with a real Bolt handshake, which proves the protocol layer
  # is alive: the client sends the magic preamble 6060B017 followed by four
  # 4-byte version proposals, and the server replies with the 4-byte version it
  # agreed, or 00000000 if it can't agree.
  #
  # Capture the actual bytes for your version rather than trusting mine:
  #   printf '\x60\x60\xb0\x17\x00\x00\x04\x05\x00\x00\x00\x04\x00\x00\x00\x00\x00\x00\x00\x00' \
  #     | nc ip-10-0-25-221.ec2.internal 7687 | xxd
  # then encode the exchange as:
  #   tcp-check send-binary 6060b017
  #   tcp-check send-binary <your four proposals>
  #   tcp-check expect !binary 00000000
  option tcp-check
  tcp-check connect
  default-server check inter 3s fall 3 rise 2

  server bolt01 ip-10-0-29-201.ec2.internal:7687
  server bolt02 ip-10-0-20-122.ec2.internal:7687
  server bolt03 ip-10-0-25-221.ec2.internal:7687

  # [NOTE] This is passthrough, so the client's TLS reaches the node directly.
  # Each node therefore needs a cert whose SAN covers BOTH the LB name the
  # client dialled and its own advertised address. A wildcard cert installed on
  # all three nodes is the simplest way to satisfy that.


#===============================================================================
# YOUR DOCKER SETUP
#===============================================================================
#
#   docker run -dt --name haproxy01 \
#     --network host \
#     --volume=$HOME/haproxy01:/usr/local/etc/haproxy:rw \
#     --user="$(id -u):$(id -g)" \
#     --restart=always \
#     --ulimit nofile=200000:200000 \        <-- ADD THIS
#     haproxy:alpine
#
# Validate before restarting — --restart=always turns a config error into a
# crash loop, which is what the log you saw was:
#
#   docker run --rm -v "$HOME/haproxy01:/usr/local/etc/haproxy:ro" \
#     haproxy:alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
#
# Implications of your specific flags:
#
# --network host
#   No netns of its own, so kernel tuning comes from the EC2 host and
#   /etc/sysctl.d works normally (see below). Do NOT pass --sysctl net.* — it's
#   rejected in host mode. Also no NAT and no conntrack in the path, which is
#   the right call for perf testing.
#   Ports 7473/7474/7687/8404 bind directly on the host: make sure nothing else
#   holds them, and that the security group allows them. 9999 (runtime API) is
#   loopback-only and must NOT be in the security group.
#
# --user "$(id -u):$(id -g)"
#   * Cannot bind ports below 1024. All ports here are above it, so fine.
#   * Cannot write /var/run, and often cannot write the mounted config dir
#     either (anything copied in with sudo leaves it root-owned, readable at 755
#     but not writable). That is why the runtime API is a loopback TCP listener
#     rather than a socket file. Check with:
#       ls -ld $HOME/haproxy01
#       docker exec haproxy01 sh -c 'id; touch /usr/local/etc/haproxy/probe \
#         && echo WRITABLE || echo NOT-WRITABLE'
#     The cert only needs to be READ, so a root-owned 644 file there is fine.
#   * Cannot raise its own hard RLIMIT_NOFILE. HAProxy will try to raise the fd
#     limit to satisfy 'maxconn 60000' and, as a non-root process, can only go
#     up to the hard limit it was given. Without --ulimit you'll get:
#       [WARNING] cannot raise FD limit to N, limit is M
#     and HAProxy will silently reduce maxconn. Grep the logs for that after
#     every start — it is the single easiest way to cap a load test by accident.
#
# --restart=always
#   Fine, but always run the -c validation above first.
#
# Reload without dropping connections (the entrypoint already runs -W):
#   docker kill -s USR2 haproxy01
#
# Confirm the Prometheus exporter is compiled into this image:
#   docker exec haproxy01 haproxy -vv | grep -i prometheus
# Official images have built it in since 2.4; if it's missing, drop the
# 'http-request use-service prometheus-exporter' line from the monitoring
# frontend and use the stats page and runtime socket instead.
#
#===============================================================================
# KERNEL LIMITS — with --network host
#===============================================================================
#
# Because you run with --network host, the container shares the host's network
# namespace, so these belong on the EC2 host after all:
#
#   /etc/sysctl.d/99-haproxy.conf
#     net.ipv4.ip_local_port_range = 1024 65535
#     net.ipv4.tcp_tw_reuse = 1
#     net.core.somaxconn = 65535
#     net.ipv4.tcp_max_syn_backlog = 65535
#
#   sudo sysctl --system
#
# Do NOT pass these as --sysctl: net.* sysctls are rejected in host network
# mode, since there is no separate namespace to configure. (Under default bridge
# networking it would be the other way round — all four are net-namespaced, so
# host values would be inert and --sysctl would be the only way to set them.)
#
# The fd limit is NOT a sysctl and does not come from the host: it's a per-process
# rlimit, so it must be on the docker run line as --ulimit. systemd's LimitNOFILE
# is irrelevant here — systemd isn't supervising this process.
#
# Verify from inside rather than assuming:
#   docker exec haproxy01 sysctl net.ipv4.ip_local_port_range net.core.somaxconn
#   docker exec haproxy01 sh -c 'ulimit -n'
#
# What each one is actually worth here:
#
#   ip_local_port_range  — the one that matters. In host network mode HAProxy's
#     outbound connections use the host's own ephemeral range to reach the 3
#     nodes; the default 32768-60999 gives ~28k ports per (dst IP, dst port).
#     'http-reuse always' largely avoids this on the Query API path, but the
#     benchmark's fresh-connection modes and heavy Bolt fan-out will not.
#     Note this range is now shared with everything else on the box.
#
#   nofile               — the other one that matters, and the one most likely to
#     bite given --user is non-root. 'maxconn 60000' needs roughly 2 fds per
#     connection plus listeners and checks. HAProxy raises its own soft limit at
#     startup but a non-root process cannot raise the hard limit, so without
#     --ulimit it silently reduces maxconn instead.
#
#   somaxconn            — caps the listen backlog (HAProxy uses
#     min(maxconn, somaxconn)). Matters for connection-rate bursts, not steady
#     state. HAProxy's own 'backlog' setting interacts with it.
#
#   tcp_max_syn_backlog  — SYN queue depth. Same story: burst protection.
#
#   tcp_tw_reuse         — lets outbound connections reuse TIME_WAIT sockets.
#     Worth setting given how many short-lived connections the fresh-connection
#     benchmark modes create.
#
#   tcp_fin_timeout      — DROPPED from the list. It governs FIN_WAIT_2, not
#     TIME_WAIT, so it does nothing for port exhaustion. TIME_WAIT is a fixed
#     60s in Linux and is not tunable via sysctl. This one is cargo cult.
#
# One thing you get for free with --network host: no conntrack concern. Under
# bridge networking every connection through a published port is NAT'd and
# tracked, and nf_conntrack_max is not namespaced — a full table produces
# "nf_conntrack: table full, dropping packet" in dmesg, which presents as random
# connection failures and latency spikes that look like the database stalling.
# Host mode skips the iptables path entirely, so you measure HAProxy rather than
# HAProxy plus Docker's NAT. Right choice for this.
#
# Confirm you're actually in host mode:
#   docker inspect -f '{{.HostConfig.NetworkMode}}' haproxy01
#
# Apply the same port-range and nofile limits to the LOAD GENERATOR host. A
# client that runs out of sockets looks exactly like a server that has stopped
# scaling — which is why the runner now reports 'fd-exhausted' and
# 'ports-exhausted' as distinct error classes.
#
# Neo4j side — required for the Query API on a cluster, or writes that land on
# a follower fail with NotALeader:
#   dbms.routing.enabled=true
#
#===============================================================================
# MEASUREMENT HYGIENE
#===============================================================================
#
# 1. Run a control test straight at ONE node, bypassing HAProxy entirely. If
#    single-node-direct beats three-nodes-via-LB, the LB is your bottleneck.
#    On small instance types HAProxy saturates a core well before Neo4j does.
#
# 2. Watch 'srv_conn', 'qcur' and 'qtime' in the stats socket during runs.
#    Non-zero qcur means requests are queueing in HAProxy, not in the database.
