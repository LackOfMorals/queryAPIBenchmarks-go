server.default_listen_address=0.0.0.0
# replace all four of these with internal ec2 address of this neo4j server
server.default_advertised_address=ip-10-0-29-201.ec2.internal
server.cluster.advertised_address=ip-10-0-29-201.ec2.internal:6000
server.cluster.raft.advertised_address=ip-10-0-29-201.ec2.internal:7000
server.routing.advertised_address=ip-10-0-29-201.ec2.internal:7688


# a list of internal ec2 addresses for each cluster member.  replace as needed
dbms.cluster.endpoints=ip-10-0-29-201.ec2.internal:6000,ip-10-0-20-122.ec2.internal:6000,ip-10-0-25-221.ec2.internal:6000
initial.dbms.default_primaries_count=3
dbms.routing.enabled=true
dbms.routing.default_router=server

server.directories.plugins=/plugins
server.directories.logs=/logs

internal.dbms.bolt.local_object_enabled=true
internal.server.bolt.tcp_fast_open=true


# allows for getting a dump file from various locations
dbms.databases.seed_from_uri_providers=CloudSeedProvider,FileSeedProvider,ServerSeedProvider


#############################################################
# Neo4j Configuration - m8i.2xlarge (8 vCPU / 32 GiB RAM)
# Standalone instance, EBS-backed storage
# 
#############################################################

# ── Memory ──────────────────────────────────────────────────
# generated by neo4j-admin 
server.memory.heap.initial_size=11700m
server.memory.heap.max_size=11700m
server.memory.pagecache.size=12000m



# Per-transaction memory limits
db.memory.transaction.total.max=4g
db.memory.transaction.max=512m

# ── JVM ─────────────────────────────────────────────────────
server.jvm.additional=-XX:+UseG1GC
server.jvm.additional=-XX:+ParallelRefProcEnabled
server.jvm.additional=-XX:MaxGCPauseMillis=200
server.jvm.additional=-XX:+DisableExplicitGC
server.jvm.additional=-XX:+AlwaysPreTouch
server.jvm.additional=-XX:+ExitOnOutOfMemoryError
server.jvm.additional=-Djdk.nio.maxCachedBufferSize=262144


# ── Bolt thread pool ─────────────────────────────────────────
# 8 vCPUs — generous upper bound for concurrent connections
server.bolt.thread_pool_min_size=5
server.bolt.thread_pool_max_size=400
server.bolt.thread_pool_keep_alive=5m


# ── Transaction settings ─────────────────────────────────────
db.transaction.timeout=60s
db.transaction.concurrent.maximum=1000

# Lock acquisition timeout — prevents long waits on contended resources
db.lock.acquisition.timeout=10s

# ── Transaction log ──────────────────────────────────────────
db.tx_log.rotation.retention_policy=3 days
db.tx_log.rotation.size=256m
db.tx_log.preallocate=true

# ── Checkpointing ────────────────────────────────────────────
db.checkpoint=periodic
db.checkpoint.interval.time=15m
db.checkpoint.interval.tx=100000


# Uncomment to log slow queries
# db.logs.query.enabled=INFO
# db.logs.query.threshold=1000ms
# db.logs.query.plan_description_enabled=true
# db.logs.query.parameter_logging_enabled=false

# ── Indexes ──────────────────────────────────────────────────
# Population workers — use half available vCPUs
db.index_sampling.background_enabled=true
db.index_sampling.sample_size_limit=8388608


# ── Logging ─────────────────────────────────────────────────
server.logs.debug.enabled=false
db.logs.query.enabled=OFF

# ── Security ─────────────────────────────────────────────────
dbms.security.procedures.unrestricted=apoc.*,gds.*


# ── Metrics (optional, for Prometheus scraping) ──────────────
# server.metrics.enabled=true
# server.metrics.prometheus.enabled=true
# server.metrics.prometheus.endpoint=localhost:2004

