# Benchmark query suite — UK Companies House graph
# Run with: ./bench -queries-file queries.toml [flags]
# See Makefile bench-* targets for the matching individual runs.

[[queries]]
label  = "point-lookup"
cypher = "MATCH (c:Company {companyNumber: '02026964'}) RETURN c.name, c.status, c.incorporationDate"

[[queries]]
label  = "filtered-scan"
cypher = "MATCH (c:Company) WHERE c.status = 'Active' AND c.postCodePrefix = 'SE22' RETURN c.name, c.companyNumber LIMIT 100"

[[queries]]
label  = "one-hop"
cypher = "MATCH (:Company {companyNumber: 'SC521741'})<-[:OFFICER_OF]-(p:Person) RETURN p.chName, p.nationality, p.occupation"

[[queries]]
label  = "two-hop"
cypher = "MATCH (:Company {companyNumber: 'SC521741'})<-[:OFFICER_OF]-(p:Person)-[:OFFICER_OF]->(other:Company) RETURN DISTINCT other.name, other.companyNumber, p.chName LIMIT 50"

[[queries]]
label  = "psc-lookup"
cypher = "MATCH (c:Company {companyNumber: '13244615'})<-[r:PSC_OF]-(psc) RETURN coalesce(psc.chName, psc.name) AS pscName, r.natures, r.ownershipMin, r.ownershipMax"

[[queries]]
label  = "aggregation"
cypher = "MATCH (s:SICCode) RETURN s.code, s.companyCount AS companyCount ORDER BY companyCount DESC LIMIT 20"

[[queries]]
label  = "fulltext-search"
cypher = "CALL db.index.fulltext.queryNodes('company_name_search', 'TESCO') YIELD node, score RETURN node.name, node.companyNumber, score LIMIT 20"

[[queries]]
label  = "supernode-fanout"
cypher = "MATCH (a:Address {postCode: 'WC2H 9JQ'})<-[:REGISTERED_AT]-(c:Company) RETURN c.companyNumber, c.name LIMIT 100"

[[queries]]
label  = "count-scalar"
cypher = "MATCH (c:Company) WHERE c.status = 'Active' RETURN count(c) LIMIT 100"

[[queries]]
label  = "bulk-rows"
cypher = "MATCH (c:Company) WHERE c.status = 'Active' RETURN c.companyNumber, c.name, c.postCode SKIP 0 LIMIT 1000"

# Size ladder for the streaming (-streaming) axis: does the buffered-vs-
# streaming gap grow with result size, or stay flat? Both share the same
# 10MB query-go-sdk response cap (enforced identically for Execute and
# ExecuteStream), so even 20k rows of this narrow shape stays well under it.
[[queries]]
label  = "bulk-rows-5k"
cypher = "MATCH (c:Company) WHERE c.status = 'Active' RETURN c.companyNumber, c.name, c.postCode SKIP 0 LIMIT 5000"

[[queries]]
label  = "bulk-rows-20k"
cypher = "MATCH (c:Company) WHERE c.status = 'Active' RETURN c.companyNumber, c.name, c.postCode SKIP 0 LIMIT 20000"

# Same row count as bulk-rows, more columns per row — isolates row *width*
# from row *count* for the streaming comparison.
[[queries]]
label  = "bulk-rows-wide"
cypher = "MATCH (c:Company) WHERE c.status = 'Active' RETURN c.companyNumber, c.name, c.status, c.incorporationDate, c.postCode, c.postCodePrefix SKIP 0 LIMIT 1000"
